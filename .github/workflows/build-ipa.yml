name: Build unsigned IPA

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    paths-ignore: ['**.md', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish this build as a GitHub prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: unsigned-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  build-ipa:
    runs-on: xcode-27
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require selected toolchain
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -1)" = "Xcode 27.2"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "27.2"
      - name: Build and verify the unsigned package
        env:
          BUILD_ROOT: build/ci
        run: bash build-mac.sh
      - name: Prepare files for a manual prerelease or release
        id: package
        run: |
          python3 Scripts/release_metadata.py prepare --ipa build/ci/release/KickUnblock-unsigned.ipa --out build/ci/publish
          cp build/ci/release/verification.json build/ci/release/toolchain.txt build/ci/publish/
          dsym=build/ci/dd/Build/Products/Release-iphoneos/KickUnblock.app.dSYM
          xcrun dwarfdump --uuid "$dsym" > build/ci/publish/dSYM-UUID.txt
          ditto -c -k --keepParent "$dsym" build/ci/publish/KickUnblock.app.dSYM.zip
          echo "tag=$(python3 Scripts/release_metadata.py tag)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success() && github.event_name != 'pull_request'
        with:
          name: KickUnblock-${{ steps.package.outputs.tag }}-${{ github.sha }}
          path: build/ci/publish/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: KickUnblock-failed-build-logs-${{ github.sha }}
          path: |
            build/ci/*.log
            build/ci/toolchain.txt
          if-no-files-found: ignore
          retention-days: 30

  publish-prerelease:
    needs: build-ipa
    if: github.event_name == 'workflow_dispatch' && inputs.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: KickUnblock-${{ needs.build-ipa.outputs.tag }}-${{ github.sha }}
          path: publish
      - name: Create the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-ipa.outputs.tag }}
        working-directory: publish
        run: |
          sha256sum -c SHA256SUMS
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf '%s already exists. Bump CURRENT_PROJECT_VERSION in project.yml first.\n' "$TAG" >&2
            exit 1
          fi
          title="KickUnblock $(jq -r '"\(.version) (\(.buildVersion))"' release.json)"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "$title" --notes-file notes.md \
            KickUnblock.ipa release.json SHA256SUMS KickUnblock.app.dSYM.zip
